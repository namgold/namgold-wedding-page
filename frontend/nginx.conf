# JSON access log on stdout so the log collector (see ~/devbox/logging) gets searchable fields.
# Client IP comes from Cloudflare's header; the level is derived from the status.
map $status $log_level {
    ~^5     "error";
    ~^4     "warn";
    default "info";
}
log_format json escape=json
    '{"level":"$log_level","msg":"http_request","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_status":"$upstream_status","client_ip":"$http_cf_connecting_ip","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout json;

    # Compress text assets (woff2 is already compressed). Do not rely on the CDN edge for this.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/calendar;

    # / serves the /wedding page (internal, the URL stays /). There is no page at /en, and the other
    # places' URLs must not be revealed.
    location = / { try_files /wedding.html =404; }
    location = /en { return 404; }
    location = /en/ { return 404; }
    location = /index.html { return 404; } # the stock nginx welcome page from the base image
    # Same for the place pages: /nha-trang/ and /en/nha-trang/ -> no trailing slash
    location ~ ^/((?:en/)?[a-z0-9-]+)/$ { absolute_redirect off; return 301 /$1; }

    # Go API. The variable + resolver make nginx start (and recover) even if `api` is down,
    # instead of refusing to boot when the upstream name does not resolve.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    # Admin shell: never cached, never indexed. Access (Cloudflare) + the API enforce auth.
    location = /admin/ { absolute_redirect off; return 301 /admin; }
    location = /admin {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files /admin.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Calendar invites: served inline as text/calendar so iOS Safari opens its "Add to Calendar" sheet.
    location ~ \.ics$ {
        default_type text/calendar;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets only; other files (images) keep default caching so they can be replaced.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
